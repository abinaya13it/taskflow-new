# TaskFlow Pro Spring Boot Backend Configuration
server.port=${PORT:5000}

# Application Name
spring.application.name=taskflow-backend

# Active profile (defaults to in-memory H2 so it works instantly without MySQL running)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Disable automatic SQL script initialization (Hibernate DDL auto manages the schema)
spring.sql.init.mode=never

# MySQL Database Configuration (Default)
# Overridable via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskflow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console (available when running in h2 profile or as backup)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.taskflow=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
